global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "routeflow-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          app: "routeflow"
          environment: "production"
          group: "78"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]


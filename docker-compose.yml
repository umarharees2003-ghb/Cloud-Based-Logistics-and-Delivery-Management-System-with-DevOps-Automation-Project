x-log-options: &log-options
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./Front-End
      dockerfile: Dockerfile
    container_name: routeflow-frontend
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging: *log-options
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - routeflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --timeout=3 --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./Back-End
      dockerfile: Dockerfile
    container_name: routeflow-backend
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    restart: unless-stopped
    logging: *log-options
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-production}
      - PORT=5000
      - TRUST_PROXY_HOPS=1
      - MONGODB_URI=mongodb://mongodb:27017/routeflow
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ALLOW_PUBLIC_STAFF_SIGNUP=${ALLOW_PUBLIC_STAFF_SIGNUP:-false}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080,http://frontend:8080,http://localhost:5173,http://127.0.0.1:5173}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PROMETHEUS_METRICS_ENABLED=${PROMETHEUS_METRICS_ENABLED:-true}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - routeflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "const request=require('http').get('http://127.0.0.1:5000/api/health/ready',response=>{response.resume();process.exit(response.statusCode===200?0:1)});request.on('error',()=>process.exit(1));request.setTimeout(3000,()=>request.destroy());"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:6-jammy
    container_name: routeflow-mongodb
    restart: unless-stopped
    logging: *log-options
    volumes:
      - mongodb_data:/data/db
    networks:
      - routeflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.53.0
    container_name: routeflow-prometheus
    restart: unless-stopped
    logging: *log-options
    ports:
      - "127.0.0.1:9090:9090"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - prometheus_data:/prometheus
      - ./Back-End/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - routeflow-network
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:10.4.5
    container_name: routeflow-grafana
    restart: unless-stopped
    logging: *log-options
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    entrypoint: ["/bin/sh", "-ec", 'test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "Set GRAFANA_ADMIN_PASSWORD"; exit 1; }; exec /run.sh']
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Back-End/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./Back-End/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - routeflow-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --timeout=3 --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  routeflow-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

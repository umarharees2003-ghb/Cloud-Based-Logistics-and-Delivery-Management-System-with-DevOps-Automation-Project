name: Routeflow Continuous Integration
on:
  push:
    branches: [main, master, UmarHarees-Routeflow, dinura, routeflow-v2]
  pull_request:
    branches: [main, master, UmarHarees-Routeflow, dinura]
concurrency:
  group: routeflow-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-test:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Back-End/package-lock.json
      - run: npm ci
        working-directory: Back-End
      - run: npm run test:coverage
        working-directory: Back-End
        env:
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Back-End/coverage
  frontend-build:
    name: Frontend build and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Front-End/package-lock.json
            Back-End/package-lock.json
      - run: npm ci
        working-directory: Back-End
      - run: npm ci
        working-directory: Front-End
      - run: npm run build
        working-directory: Front-End
      - run: npx playwright install --with-deps chromium
        working-directory: Front-End
      - run: npm test
        working-directory: Front-End
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: |
            Front-End/.artifacts/*.png
            Front-End/.artifacts/playwright
  docker-build:
    name: Docker health, proxy and persistence smoke test
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci_only_compose_secret_never_use_in_production_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait frontend backend mongodb
      - run: node scripts/docker-smoke.cjs --proxy-only
      - run: node scripts/docker-smoke.cjs --isolated
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
